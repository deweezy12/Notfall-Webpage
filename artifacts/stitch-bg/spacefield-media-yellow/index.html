<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spacefield Media yellow</title>
  <meta name="description" content="Spacefield Media yellow scroll animation landing page.">
  <link rel="canonical" href="https://example.com/spacefield-media-yellow/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    @font-face {
      font-family: "TAN Nimbus";
      src:
        url("/fonts/TAN-Nimbus/TAN-NIMBUS.woff2") format("woff2"),
        url("/fonts/TAN-Nimbus/TAN-NIMBUS.woff") format("woff"),
        url("/fonts/TAN-Nimbus/TAN-NIMBUS.ttf") format("truetype"),
        url("/fonts/TAN-Nimbus/TAN-NIMBUS.otf") format("opentype");
      font-display: swap;
    }

    :root {
      --stage-height: 260vh;
      --fade-opacity: 0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #043231;
      color: #111;
      scroll-behavior: auto;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      font-family: Inter, "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      background: #043231;
    }

    .scroll-stage {
      position: relative;
      height: var(--stage-height);
      background: #043231;
    }

    .hero {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background: #043231;
    }

    .spacefield-svg {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: block;
      overflow: visible;
    }

    .space-word {
      fill: #ffd205;
      font-family: "TAN Nimbus", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
      font-size: 176px;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
      text-rendering: geometricPrecision;
      user-select: none;
    }

    .media-word {
      font-size: 116px;
    }

    .word-layer {
      will-change: transform;
    }

    .white-wash {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: #ffd205;
      opacity: var(--fade-opacity);
      will-change: opacity;
    }

    .next-section {
      min-height: 100vh;
      padding: clamp(4rem, 10vw, 9rem) clamp(1.25rem, 6vw, 5rem);
      background: #ffd205;
      color: #111;
    }

    .next-section-inner {
      max-width: 920px;
      margin: 0 auto;
    }

    .next-section h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.25rem, 6vw, 5rem);
      line-height: 0.95;
      letter-spacing: 0;
      font-family: "TAN Nimbus", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
    }

    .next-section p {
      max-width: 38rem;
      margin: 0;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main>
    <section class="scroll-stage" id="space-stage" aria-label="SPACEFIELD scroll animation">
      <div class="hero">
        <svg class="spacefield-svg" id="spacefield-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="SPACEFIELD">
          <g class="word-layer" id="word-layer">
            <text class="space-word" id="space-word" x="600" y="355" text-anchor="middle" dominant-baseline="middle">
              <tspan>S</tspan><tspan>P</tspan><tspan>A</tspan><tspan>C</tspan><tspan>E</tspan><tspan id="target-f">F</tspan><tspan>I</tspan><tspan>E</tspan><tspan>L</tspan><tspan>D</tspan>
            </text>
            <text class="space-word media-word" x="600" y="510" text-anchor="middle" dominant-baseline="middle">MEDIA</text>
          </g>
        </svg>
        <div class="white-wash" id="white-wash"></div>
      </div>
    </section>

    <section class="next-section">
      <div class="next-section-inner">
        <h1>Arrival</h1>
        <p>
          The zoom resolves into a clean white section, ready for the rest of the landing page content.
        </p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const stage = document.getElementById("space-stage");
      const wordLayer = document.getElementById("word-layer");
      const targetLetter = document.getElementById("target-f");
      const root = document.documentElement;
      const viewBox = { width: 1200, height: 800, centerX: 600, centerY: 400 };

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const smoothstep = (edge0, edge1, value) => {
        const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
        return t * t * (3 - 2 * t);
      };

      let maxScale = 7;
      let startOriginX = viewBox.centerX;
      let startOriginY = viewBox.centerY;
      let endOriginX = viewBox.centerX;
      let endOriginY = viewBox.centerY;
      let ticking = false;

      function measureTarget() {
        wordLayer.setAttribute("transform", "");

        const targetBox = targetLetter.getBBox();
        startOriginX = targetBox.x + targetBox.width * 0.26;
        startOriginY = targetBox.y + targetBox.height * 0.47;
        endOriginX = targetBox.x + targetBox.width * 0.68;
        endOriginY = targetBox.y + targetBox.height * 0.39;
        maxScale = 90;

        update();
      }

      function update() {
        ticking = false;

        const stageRect = stage.getBoundingClientRect();
        const scrollableDistance = Math.max(stage.offsetHeight - window.innerHeight, 1);
        const rawProgress = clamp(-stageRect.top / scrollableDistance, 0, 1);
        const zoomProgress = Math.pow(rawProgress, 1.55);
        const scale = Math.pow(maxScale, zoomProgress);
        const targetShift = smoothstep(4.5, 22, scale);
        const originX = startOriginX + (endOriginX - startOriginX) * targetShift;
        const originY = startOriginY + (endOriginY - startOriginY) * targetShift;
        const targetX = (viewBox.centerX - originX) * zoomProgress;
        const targetY = (viewBox.centerY - originY) * zoomProgress;
        const fade = smoothstep(0.76, 0.99, rawProgress);

        wordLayer.setAttribute(
          "transform",
          `translate(${targetX.toFixed(2)} ${targetY.toFixed(2)}) translate(${originX.toFixed(2)} ${originY.toFixed(2)}) scale(${scale.toFixed(4)}) translate(${(-originX).toFixed(2)} ${(-originY).toFixed(2)})`
        );
        root.style.setProperty("--fade-opacity", fade.toFixed(4));
      }

      function requestUpdate() {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(update);
        }
      }

      window.addEventListener("scroll", requestUpdate, { passive: true });
      window.addEventListener("resize", measureTarget);
      window.addEventListener("load", measureTarget);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(measureTarget);
      }

      measureTarget();
    })();
  </script>
</body>
</html>
