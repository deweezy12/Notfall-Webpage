kind = "web"
previewPath = "/"
title = "Stitch Background"
version = "1.0.0"
id = "artifacts/stitch-bg"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26170

[services.development]
run = "pnpm --filter @workspace/stitch-bg run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stitch-bg", "run", "build" ]
publicDir = "artifacts/stitch-bg/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26170"
BASE_PATH = "/"
